name: CI (development)

# Build + lint + unit-test gate for the public web site - runs on every push
# to "development" and on pull requests targeting it. Added 2026-08-21
# (refactor sweep, bucket B): until now this repo had no CI at all, so a
# broken spec or a non-compiling change only surfaced when someone ran
# build-deploy-dev locally.
#
# This workflow does NOT deploy. Deploys stay manual (npm run
# build-deploy-dev / build-deploy-prod) until a FIREBASE_SERVICE_ACCOUNT
# secret exists for this repo - see the commented block at the bottom for
# the exact steps to enable it (it mirrors the reader repo's
# deploy-development.yml).
on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

concurrency:
  group: ci-development-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # src/common (impact-discipleship-library-common) is a public
          # submodule; the default token is enough to clone it.
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # --legacy-peer-deps: @angular/fire@20.0.1's peer range still points at
      # Angular 20.0.x, one minor behind this app's ^20.3 packages; the code is
      # compatible, the peer metadata is stale. `npm ci` re-validates peer
      # ranges strictly, so the flag is needed here even though the lockfile
      # already resolves cleanly.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      # ubuntu-latest ships Google Chrome, which the Karma ChromeHeadless
      # launcher uses; add browser-actions/setup-chrome if a future runner
      # image lacks it.
      - name: Unit tests
        run: npm test

      - name: Build (development configuration)
        run: npm run build-dev

      # ---- To enable CI deploys later (dev project) ----
      # 1. Create a service account JSON key with the Firebase Hosting Admin +
      #    Cloud Run Viewer roles on impactdisciplesdev and add it as the
      #    repository secret FIREBASE_SERVICE_ACCOUNT.
      # 2. Uncomment:
      # - name: Install firebase-tools
      #   run: npm install -g firebase-tools@14.17.0
      # - name: Authenticate to Google Cloud
      #   uses: google-github-actions/auth@v3
      #   with:
      #     credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
