<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Impact Disciples</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;1,400&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#1976d2">
  <style>
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      font-family: 'Lato', Arial, sans-serif;
      background: #ffffff;
      color: #1f1f1f;
      text-align: center;
    }
    .wrap {
      max-width: 480px;
    }
    .wrap img {
      max-width: 220px;
      width: 100%;
      height: auto;
      margin-bottom: 32px;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      margin: 0 0 8px;
      letter-spacing: 0.02em;
    }
    p {
      font-size: 18px;
      font-weight: 300;
      margin: 0;
      color: #4a4a4a;
    }
    .accent {
      display: block;
      width: 56px;
      height: 3px;
      background: #1976d2;
      margin: 20px auto 24px;
      border: none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img src="Impact-Logo_Black.png" alt="Impact Disciples">
    <h1>Under Construction....</h1>
    <hr class="accent">
    <p>be back soon!</p>
  </div>
</body>
</html>
