<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Impactdisciples</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
  <!-- Bootstrap CSS is already bundled locally (see angular.json "styles"); this
       CDN copy was a duplicate download of the same stylesheet on every page load. -->
  <!-- Material Design Icons and Boxicons were loaded here but have zero usages
       anywhere in this app's templates (grep-verified) -- dropped as dead weight. -->
  <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.3.0/css/font-awesome.min.css" rel="stylesheet">
  <!-- Stripe.js and the YouTube iframe API are intentionally NOT loaded here.
       @stripe/stripe-js's loadStripe() (see StripeService) and Angular's
       <youtube-player> component both inject their own <script> tag
       on-demand the first time they're actually used -- hardcoding them
       here forced every page (store, team, account, ...) to load both,
       whether or not that page has anything to do with payments or video. -->
  <script src="https://kit.fontawesome.com/5765b54b00.js" crossorigin="anonymous" defer></script>
  <meta name="theme-color" content="#1976d2">
</head>
<body>
  <!-- Bootstrap's JS bundle was removed: grep-verified zero remaining usages
       of data-bs-* attributes or the `bootstrap` JS API anywhere in the live
       app (its only consumers were in the now-deleted theme/* tree). -->
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>
</html>
