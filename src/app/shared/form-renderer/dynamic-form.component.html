<div class="dynamic-form">
  @if (loading) {
    <div class="dynamic-form__status">Loading form&hellip;</div>
  }

  @if (!loading && notFound) {
    <div class="dynamic-form__status dynamic-form__status--error">
      This form isn't available right now.
    </div>
  }

  @if (!loading && !notFound && formDef) {
    @if (submitted) {
      <div class="dynamic-form__status dynamic-form__status--success">
        Thank you! Your submission has been received.
      </div>
    }
    @if (!submitted) {
      <form [formGroup]="form" (ngSubmit)="onSubmit()" [style.background-color]="formDef.backgroundColor || null" [ngStyle]="controlStyleVars" class="dynamic-form__fields">
        @for (field of fields; track field) {
          <app-dynamic-form-field [field]="field" [form]="form"></app-dynamic-form-field>
        }
        <button type="submit" class="impact-btn impact-btn-blue dynamic-form__submit" [disabled]="submitting">
          {{ submitting ? 'Submitting…' : submitButtonText }}
        </button>
      </form>
    }
  }
</div>
