<section class="dms" [style.backgroundImage]="'url(' + backgroundUrl + ')'">
  <div class="dms__overlay">
    <div class="dms__title">
      <h2 appAnimate="fadeInUp">{{ titleLead }} <span>{{ titleAccent }}</span></h2>
    </div>
    <div class="dms__countdown">
      <div class="time-part">
        <span class="number">{{ days }}</span>
        <span class="label">DAYS</span>
      </div>
      <span class="colon">:</span>
      <div class="time-part">
        <span class="number">{{ hours }}</span>
        <span class="label">HOURS</span>
      </div>
      <span class="colon">:</span>
      <div class="time-part">
        <span class="number">{{ minutes }}</span>
        <span class="label">MINUTES</span>
      </div>
      <span class="colon">:</span>
      <div class="time-part">
        <span class="number">{{ seconds }}</span>
        <span class="label">SECONDS</span>
      </div>
    </div>
    <div class="dms__button">
      <a target="_blank" appAnimate="fadeInUpFour" [href]="'/summit/' + (dms?.startDate ? (dms.startDate.toString() | date: 'yyyy') : '')" class="impact-btn impact-btn-blue">{{ ctaTitle }}</a>
    </div>
  </div>
</section>
