<section class="dms" [style.backgroundImage]="'url(https://firebasestorage.googleapis.com/v0/b/impactdisciples-a82a8.appspot.com/o/Web-Pages%2FShared%2Fsummit-banner-large.PNG?alt=media&token=74f6f522-2b3e-48f0-bdb9-2b363abbe80e)'">
  <div class="dms__overlay">
    <div class="dms__title">
      <h2 appAnimate="fadeInUp">DISCIPLE-MAKING <span>SUMMIT</span></h2>
    </div>
    <div class="dms__countdown">
      <div class="time-part">
        <span class="number">{{ days }}</span>
        <span class="label">DAYS</span>
      </div>
      <span class="colon">:</span>
      <div class="time-part">
        <span class="number">{{ hours }}</span>
        <span class="label">HOURS</span>
      </div>
      <span class="colon">:</span>
      <div class="time-part">
        <span class="number">{{ minutes }}</span>
        <span class="label">MINUTES</span>
      </div>
      <span class="colon">:</span>
      <div class="time-part">
        <span class="number">{{ seconds }}</span>
        <span class="label">SECONDS</span>
      </div>
    </div>
    <div class="dms__button">
      <a target="_blank" appAnimate="fadeInUpFour" [href]="'/summit/' + (dms?.startDate ? (dms.startDate.toString() | date: 'yyyy') : '')" class="impact-btn impact-btn-blue">REGISTER NOW</a>
    </div>
  </div>
</section>
