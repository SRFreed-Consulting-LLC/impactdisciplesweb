<section class="id-section id-section--surface">
  <div class="id-container">
    <div class="id-split" style="--split: 1fr 1.3fr">
      <div class="id-stack">
        <p class="id-label id-label--accent" appAnimate="fadeInUp">The store</p>
        <h2 class="id-h2" appAnimate="fadeInUp">Discover powerful disciple-making resources</h2>
        <p class="id-lead" appAnimate="fadeInUpTwo">
          Books, journals and curriculum built to give your church practical tools
          and biblical insight — not another programme to run.
        </p>
        <div class="id-cluster" appAnimate="fadeInUpThree">
          <a routerLink="/store" class="id-btn id-btn--lg">Visit the store</a>
          <a routerLink="/e-books" class="id-btn id-btn--lg id-btn--ghost">Free e-books</a>
        </div>
      </div>

      <div class="id-media id-media--contain" style="--ratio: 16 / 10; background: transparent">
        <img
          loading="lazy"
          src="https://firebasestorage.googleapis.com/v0/b/impactdisciples-a82a8.appspot.com/o/Store%2FDMC-Series_Five-Images-1.png?alt=media&token=97f755c0-3c73-4545-979c-6428c3f2ab98"
          alt="A selection of Impact Discipleship Ministries books">
      </div>
    </div>
  </div>
</section>
