<!-- The single newsletter ask on any page. The footer used to repeat the same
     three fields immediately below this band; it now links here instead. -->
<section class="id-section id-section--inverted id-subscribe">
  <div class="id-container">
    <div class="id-split" style="--split: 1fr 1.1fr">
      <div class="id-stack id-stack--tight">
        <p class="id-label" style="color: var(--c-accent)">Newsletter</p>
        <h2 class="id-h3">Stay in the loop</h2>
        <p style="color: var(--c-inv-ink-muted); max-width: 40ch">
          Join over 1,000 people who get free and fresh disciple-making content
          delivered automatically each time we publish.
        </p>
      </div>

      <form class="id-stack id-stack--tight" (ngSubmit)="handleFormSubmit()">
        <div class="id-subscribe__form">
          <label class="id-sr-only" for="sub-first">First name</label>
          <input
            id="sub-first"
            class="id-input"
            required
            type="text"
            name="firstName"
            autocomplete="given-name"
            [(ngModel)]="subscription.firstName"
            placeholder="First name">

          <label class="id-sr-only" for="sub-last">Last name</label>
          <input
            id="sub-last"
            class="id-input"
            required
            type="text"
            name="lastName"
            autocomplete="family-name"
            [(ngModel)]="subscription.lastName"
            placeholder="Last name">

          <span></span>

          <label class="id-sr-only" for="sub-email">Email address</label>
          <input
            id="sub-email"
            class="id-input"
            required
            type="email"
            name="email"
            autocomplete="email"
            [(ngModel)]="subscription.email"
            placeholder="Email address"
            style="grid-column: 1 / -1">

          <button class="id-btn id-btn--lg" type="submit" style="grid-column: 1 / -1">Subscribe</button>
        </div>

        <p class="id-label" style="color: var(--c-inv-ink-muted); text-transform: none; letter-spacing: 0">
          We send roughly twice a month. Unsubscribe any time.
        </p>
      </form>
    </div>
  </div>
</section>
