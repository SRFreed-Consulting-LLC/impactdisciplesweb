<section class="subscribe__area pb-20">
  <div class="container-img pb-60" [style.backgroundImage]="backgroundUrl ? 'url(' + backgroundUrl + ')' : null">
    <div class="subscribe__inner pt-40 pr-20 pl-20">
      <div class="row justify-content-center text-center">
        <h2 class="subscribe__title">{{ title }}</h2>
        <p class="subscribe__description">{{ subtitle }}</p>
        <div class="subscribe__content text-center pt-30">
          <div class="subscribe__form">
            <form (ngSubmit)="handleFormSubmit()">
              <div class="row d-flex justify-content-center">
                <div class="col-lg-3 col-xs-12">                  
                  <input required type="name" name="firstName" [(ngModel)]="subscription.firstName" placeholder="First Name">
                </div>
                <div class="col-lg-3">
                  <input required type="name" name="lastName" [(ngModel)]="subscription.lastName" placeholder="Last Name">
                </div>
              </div>
              <div class="row d-flex justify-content-center">
                <div class="col-lg-6">
                  <input required type="email" name="email" [(ngModel)]="subscription.email" placeholder="Email">
                </div>
              </div>
              <div class="row d-flex justify-content-center">
                <div class="col-lg-6">
                  <button class="impact-btn impact-btn-blue" type="submit">subscribe</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
