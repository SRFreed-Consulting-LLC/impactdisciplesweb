<div class="impact-header" [style.backgroundImage]="'url(' + backgroundUrl + ')'">
  <div class="impact-header__content">
    <p *ngIf="pretitle" animate="fadeInUp" class="pretitle">{{ pretitle }}</p>
    <p *ngIf="title" animate="fadeInUpTwo" class="title">{{ title }}</p>
    <p *ngIf="description" animate="fadeInUpThree" class="description">{{ description }}</p>
    <hr *ngIf="showHr" animate="fadeInLeftToRight" class="slider-hr slider-hr-w100">
    <div class="buttons">
      <a *ngIf="buttonLink && !buttonClick" animate="fadeInUpFour" [href]="buttonLink" class="impact-btn impact-btn-white">
        <i [ngClass]="buttonIcon ? buttonIcon : 'd-none'"></i>
        {{ buttonText }}
      </a>
      <a *ngIf="buttonLink2 && !buttonClick2" animate="fadeInUpFour" [href]="buttonLink2" class="impact-btn impact-btn-white">
        <i [ngClass]="buttonIcon2 ? buttonIcon2 : 'd-none'"></i>
        {{ buttonText2 }}
      </a>
      <a *ngIf="buttonLink3" animate="fadeInUpFour" [href]="buttonLink3" class="impact-btn impact-btn-white">
        <i [ngClass]="buttonIcon3 ? buttonIcon3 : 'd-none'"></i>
        {{ buttonText3 }}
      </a>
      <a *ngIf="buttonClick && !buttonLink" animate="fadeInUpFour" (click)="onButtonClick()" class="impact-btn impact-btn-white">{{ buttonText }}</a>
      <a *ngIf="buttonClick2 && !buttonLink2" animate="fadeInUpFour" (click)="onButtonClick2()" class="impact-btn impact-btn-white">{{ buttonText2 }}</a>
    </div>
  </div>
</div>
