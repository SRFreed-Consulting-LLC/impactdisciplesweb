<div class="services">
  <div *ngFor="let item of services">
    <div class="services__item">
      <a [href]="item.link">
        <img [src]="item.img" alt="banner" />
      </a>
      <div class="services__item-content">
        <div [innerHTML]="item.title" class="title"></div>
        <div [innerHTML]="item.description" class="description"></div>
        <a [href]="item.link"  class="impact-btn impact-btn-primary-border impact-btn-thin">READ MORE</a>
      </div>
    </div>
  </div>
</div>
