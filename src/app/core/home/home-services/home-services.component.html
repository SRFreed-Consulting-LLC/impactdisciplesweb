<section class="id-section">
  <div class="id-container">
    <div class="id-section-head">
      <p class="id-section-head__eyebrow">What we do</p>
      <h2 class="id-section-head__title">How we help churches</h2>
    </div>

    <ul class="id-grid id-grid--4">
      @for (item of services; track item.title) {
        <li>
          <a class="id-card" [href]="item.link">
            <span class="id-media id-media--wide">
              <img loading="lazy" [src]="item.img" alt="">
            </span>
            <span class="id-card__body">
              <span class="id-card__title" [innerHTML]="item.title"></span>
              <span class="id-muted" [innerHTML]="item.description"></span>
              <span class="id-card__foot">
                <span class="id-btn id-btn--quiet">Read more →</span>
              </span>
            </span>
          </a>
        </li>
      }
    </ul>
  </div>
</section>
