@switch (section.type) {
  @case (types.SLIDER) {
    <!-- The slides are their own collection; the section only places it. -->
    <app-home-header-slider></app-home-header-slider>
  }
  @case (types.SERVICES) {
    <app-home-services [items]="section.items"></app-home-services>
  }
  @case (types.SUMMIT_BANNER) {
    <app-disciple-making-summit-banner
      [title]="section.title"
      [backgroundUrl]="section.image?.url"
      [ctaTitle]="section.ctaTitle"></app-disciple-making-summit-banner>
  }
  @case (types.VIDEO) {
    <app-home-video
      [title]="section.title"
      [subtitle]="section.subtitle"
      [posterUrl]="section.image?.url"
      [videoId]="section.videoId"></app-home-video>
  }
  @case (types.BANNER) {
    <app-book-banner
      [title]="section.title"
      [subtitle]="section.subtitle"
      [imageUrl]="section.image?.url"
      [ctaTitle]="section.ctaTitle"
      [ctaDestination]="section.ctaDestination"
      [ctaUrl]="section.ctaUrl"></app-book-banner>
  }
  @case (types.SUBSCRIBE) {
    <app-subscribe-area
      [title]="section.title"
      [subtitle]="section.subtitle"
      [backgroundUrl]="section.image?.url"></app-subscribe-area>
  }
  <!-- TESTIMONIALS has no renderer yet - it is in the enum so the section
       can be added from the admin later without a submodule change. It
       falls through to @default and draws nothing. -->
  @default {}
}
