<div class="header-slider-container">
  <dx-gallery
    #gallery
    id="gallery"
    class="gallery"
    [dataSource]="images"
   
    height="100%"
    
    [showNavButtons]="false"
    [showIndicator]="true"
    [swipeEnabled]="true"
    
  >
    <div *dxTemplate="let galleryItem of 'item'">
      <div class="gallery__slide" [style.backgroundImage]="'url('+galleryItem.image.url+')'">
        <div class="gallery__slide-overlay">
          <div class="gallery__slide-content">
            <h2 class="title " animate="fadeInUp">{{galleryItem.title}}</h2>
            <hr animate="fadeInLeftToRight" class="slider-hr">
            <p class="text" animate="fadeInUpTwo">{{galleryItem.text}}</p>
            <a target="" *ngIf="galleryItem.ctaDestination != 'external'" animate="fadeInUpThree" [routerLink]="galleryItem.ctaDestination" class="impact-btn impact-btn-white">{{galleryItem.ctaTitle}}</a>
            <a target="none" *ngIf="galleryItem.ctaDestination == 'external'" animate="fadeInUpThree" [href]="galleryItem.ctaUrl" class="impact-btn impact-btn-white">{{galleryItem.ctaTitle}}</a>
          </div>
        </div>
      </div>
    </div>
  </dx-gallery>
</div>
