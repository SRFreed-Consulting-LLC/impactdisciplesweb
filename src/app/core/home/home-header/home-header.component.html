<div class="header">
  <div [ngClass]="['header__area', sticky ? 'sticky' : '']">
    <div class="header__content">
      <div class="header__content-logo">
        <a routerLink="/">
          <img
            [src]="logo"
            alt="logo"
            height="60px"
            width="65px"
            >
        </a>
      </div>
      <div class="header__content-main d-none d-lg-block">
        <app-nav-menu></app-nav-menu>
      </div>
      <div class="header__content-cart">
        <ul>
          <li>
            <a class="cursor-pointer" (click)="openCartDrawer()" (keydown.enter)="openCartDrawer()" (keydown.space)="openCartDrawer()" tabindex="0" role="button">
              <i class="ion-bag"></i> Cart
              <span>({{ cart.quantity }}) — {{ cart.total | currency }}</span>
            </a>
          </li>
        </ul>
      </div>
      <div class="header__mobile-menu-btn d-lg-none">
        <a (click)="utilsService.handleOpenMobileMenu()" (keydown.enter)="utilsService.handleOpenMobileMenu()" (keydown.space)="utilsService.handleOpenMobileMenu()" tabindex="0" role="button" class="mobile-menu-toggle cursor-pointer">
          <i class="fas fa-bars"></i>
        </a>
      </div>
    </div>
  </div>
</div>

<!-- mobile offcanvas start -->
<app-offcanvas></app-offcanvas>
