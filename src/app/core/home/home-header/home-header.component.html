<header class="id-header">
  <div class="id-container id-header__inner">
    <a routerLink="/" class="id-header__logo" aria-label="Impact Discipleship Ministries — home">
      <img [src]="impactDisciplesInfo.logo" alt="" width="56" height="56">
      <span class="id-header__wordmark">Impact<br>Discipleship</span>
    </a>

    <span class="id-header__spacer"></span>

    <app-nav-menu></app-nav-menu>

    <div class="id-header__actions">
      <button
        type="button"
        class="id-cart-btn"
        (click)="openCartDrawer()"
        [attr.aria-label]="'Open cart, ' + cart.quantity + ' items, ' + (cart.total | currency)">
        <i class="ion-bag" aria-hidden="true"></i>
        <span class="id-cart-btn__count">{{ cart.quantity }}</span>
        <span class="id-cart-btn__total">{{ cart.total | currency }}</span>
      </button>

      <button
        type="button"
        class="id-burger"
        aria-label="Open menu"
        [attr.aria-expanded]="utilsService.openMobileMenus"
        aria-controls="site-drawer"
        (click)="utilsService.handleOpenMobileMenu()">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<app-offcanvas></app-offcanvas>
