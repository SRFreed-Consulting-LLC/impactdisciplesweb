<div class="blog__item blog__border-bottom mb-30 pb-60">
  <div class="blog__content">
    <div class="blog__header mb-15">
      {{blog?.title}}
    </div>


    <div class="blog__date mb-15">
      {{blog.date.valueOf()| date: 'MMMM d, y'}}
    </div>
    <div class="blog__text mb-15" [innerHTML]="blog?.blogText"></div>
  </div>
</div>
