<app-home-header></app-home-header>

<!-- A DISPATCHER, and the one whose stack reads LEFT TO RIGHT: this page is a
     single row of two halves, so the first section is the left column and the
     second is the right. The column classes sit on the section element rather
     than inside it, because .row expects its own children to carry them.

     There is NO fallback copy here - see contact.component.ts. -->
<main class="contact">
  <section class="contact__area pb-100 pt-95">
    <div class="container">
      <div class="row">
        @for (section of sections$ | async; track section.key) {
          <app-contact-section
            class="col-xl-6 col-lg-6"
            [block]="section"
            [formId]="formId"></app-contact-section>
        }
      </div>
    </div>
  </section>
</main>

<app-footer></app-footer>
