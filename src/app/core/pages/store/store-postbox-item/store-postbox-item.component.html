<div class="product__item product__border-bottom mb-30 pb-60">
  <div class="product__thumb fix">
      <a [routerLink]="['/product-details', product?.id]">
        <img class="product__img" [src]="product?.imageUrl?.url" alt="product">
      </a>
  </div>
  <div class="product__content">
      <h4>
        <strong><a [routerLink]="['/product-details', product?.id]">{{product?.title}}</a></strong>
      </h4>
      <h5 *ngIf="product.salePrice && product.salePrice > 0"><s>$ {{ product.cost? product.cost.toFixed(2) : '0.00' }}</s></h5>
      <h5 *ngIf="product.salePrice && product.salePrice > 0"><strong>ON SALE! ${{ product.salePrice? product.salePrice.toFixed(2) : '0.00' }}</strong></h5>
      <h5 *ngIf="!product.salePrice"><strong>$ {{ product.cost? product.cost.toFixed(2) : '0.00' }}</strong></h5>
      <p class="truncate" [innerHTML]="product?.description"></p>
      <div class="d-flex">
        <a [routerLink]="['/product-details', product?.id]" class="impact-btn mr-20">view</a>
        <a (click)="addCartProduct()" class="impact-icon-btn impact-icon-btn-no-border" *ngIf="(!product.languages || product.languages.length == 0)  && (!product.colors || product.colors.length == 0) && (!product.sizes || product.sizes.length == 0)"><i class="fas fa-cart-plus"></i>ADD</a>
      </div>
  </div>
</div>
