<app-home-header></app-home-header>
<!-- Copy from Page Manager > Equipping Groups, by slot key.
     There is NO fallback here: the page_content document IS the only copy
     of this text. A block that is missing renders nothing (Shane's call,
     2026-08-29) - the templates used to carry a duplicate and it was
     removed with the seed, so nothing can silently disagree with it. -->
@let c = (content$ | async) ?? {};
<div class="equipping-groups">
  <app-header
    [backgroundUrl]="'https://firebasestorage.googleapis.com/v0/b/impactdisciples-a82a8.appspot.com/o/Web-Pages%2FHome%2Fhome-header.jpg?alt=media&token=4a6de836-e6fc-4c12-9e2a-e8c063ffdcc3'"
    [pretitle]="'ONLINE EQUIPPING GROUPS'"
    [title]="'Making of a Disciple-Maker'"
    [buttonLink]="'https://impact-discipleship-ministries.mykajabi.com/login'"
    [buttonText]="'Go to the Disciple-Making Portal'"
  ></app-header>
  <div class="equipping-groups__approach">
    <div class="content">
      <h4 appAnimate="fadeInUp" class="content__title mb-10"
          [innerHTML]="c['overview']?.heading"></h4>
      <div appAnimate="fadeInUpTwo" [innerHTML]="c['overview']?.body"></div>
    </div>
    <div class="video">
      @if (!isPlaying) {
        <div
          class="video__container"
          style="background-image: url(https://firebasestorage.googleapis.com/v0/b/impactdisciples-a82a8.appspot.com/o/Web-Pages%2FContent%2FGENERIC%20EQUPPING%20GROUP%20PHOTO.png?alt=media&token=b4e0ab45-0a02-45b3-9f2b-464fae27f7fa)"
          >
          <div class="container">
            <div class="video__content text-center">
              <div class="video__button">
                <a (click)="playVideo()" (keydown.enter)="playVideo()" (keydown.space)="playVideo()" tabindex="0" role="button" class="cursor-pointer">
                  <i class="fas fa-play"></i>
                </a>
              </div>
            </div>
          </div>
        </div>
      }

      @if (isPlaying) {
        <div class="video__container">
          <div class="video__player-wrapper">
            <youtube-player
              [videoId]="'q-NGIqAAupg'"
              [playerVars]="{ autoplay: 1 }"
              class="video__player"
            ></youtube-player>
          </div>
        </div>
      }
    </div>
  </div>
  <div class="equipping-groups__about">
    <h1 appAnimate="fadeInUp"
        [innerHTML]="c['courses']?.heading"></h1>
    <div class="content__center" style="display: flex; justify-content: center;">
      <div class="mt-10" style="width: 50%;">
        @for (course of c['courses']?.items; track $index) {
            @if (course.isActive) {
              <div class="row align-items-center pb-20">
                <div class="col-md-4 col-sm-6 align-items-start my-3">
                  <a [href]="course.link" class="impact-btn-outlined">{{ course.title }}</a>
                </div>
                <div class="col-md-8 col-sm-6">{{ course.description }}</div>
              </div>
            }
          }
      </div>
    </div>
  </div>
  <app-consulation-banner></app-consulation-banner>
</div>
<app-footer></app-footer>
