<div class="podcast-item" (click)="onSelectPodcast(podcast)">
  <a class="podcast-item__image">
    <img loading="lazy" [src]="podcast?.thumbnail?.url" alt="podcast">
  </a>
  <div class="podcast-item__content">
    <h4>
      <a>{{podcast?.title}}</a>
    </h4>
    <span>{{podcast?.date.toString() | date }}</span>
  </div>
</div>
