<app-home-header></app-home-header>

<!-- A DISPATCHER: it renders whatever sections page_content/seminars says, in
     the order it says. Staff reorder them in Page Manager > Seminars and this
     follows with no code change. app-seminars-section is the only thing that
     knows how a type maps onto this page's markup.

     There is NO fallback copy here - see seminars.component.ts. -->
<div class="seminars">
  @for (section of sections$ | async; track section.key) {
    <app-seminars-section
      [block]="section"
      [webConfig]="webConfig"
      [formId]="consultationRequestFormId"></app-seminars-section>
  }
</div>

<app-footer></app-footer>
