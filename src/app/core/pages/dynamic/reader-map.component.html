<!-- FULL WIDTH OF THE PAGE, not of the column: a world map inside the kit's
     usual measure is a postage stamp. The breakout is in the stylesheet. -->
<figure class="rmap">
  <div #mapContainer class="rmap__canvas"></div>

  <!-- The only thing the map can honestly add to its own shape. There is no
       name to show in a popup and no list to link to. -->
  @if (total) {
    <figcaption class="rmap__caption">
      {{ total }} {{ total === 1 ? 'reader' : 'readers' }}
    </figcaption>
  }
</figure>
