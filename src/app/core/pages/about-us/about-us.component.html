<app-home-header></app-home-header>

<!-- About Us is a DISPATCHER: it renders whatever sections page_content
     says, in the order it says. Staff reorder them in Page Manager > About
     Us and this follows with no code change. Which section each block draws
     is its `type`; app-about-section is the only thing that knows how a
     type maps onto markup.

     There is NO fallback copy here. The page_content document is the only
     copy of this page's text (Shane's call, 2026-08-29), so an unreadable
     read renders an empty page - which is why page_content has to exist in
     an environment before this build ships there. -->
@let view = view$ | async;
<main>
  @for (section of view?.sections ?? []; track section.key) {
    <app-about-section
      [block]="section"
      [typeIndex]="view?.typeIndex?.[section.key] ?? 0"></app-about-section>
  }
</main>

<app-footer></app-footer>
